name: Firmware Version Check

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Require matching firmware version bumps
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python check_version_bump.py "$BASE_SHA"
