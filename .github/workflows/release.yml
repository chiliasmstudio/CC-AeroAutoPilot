name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build and Validate run.lua
        run: |
          python bundle.py

      - name: Extract Version from run.lua
        id: vars
        run: |
          LUA_VER=$(python bundle.py --version)
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            TAG_NAME="${LUA_VER}"
          fi
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "lua_version=${LUA_VER}" >> $GITHUB_OUTPUT
          echo "release_title=Release ${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.vars.outputs.tag_name }}
          name: ${{ steps.vars.outputs.release_title }}
          body: |
            ## 🚀 CC-AeroAutoPilot 自動化構建發布 (${{ steps.vars.outputs.tag_name }})

            本 Release 由 GitHub Actions 自動編譯模組並完成語法校驗後產出。

            ### 📦 發布附件 (Assets)
            - **`run.lua`**：主飛控大腦程式 (版本：`${{ steps.vars.outputs.lua_version }}`)。直接放入 Minecraft 駕駛艙 Advanced Computer 中執行。
            - **`turtle_startup.lua`**：四軸動力烏龜韌體程式。放置於四軸動力烏龜 (FL, FR, BL, BR) 內作為 `startup.lua` 運行。

            ### ⚡ 快速下載指令 (CC: Tweaked 電腦內直接使用)
            ```bash
            # 1. 主駕駛艙 Advanced Computer (下載主飛控):
            wget https://github.com/chiliasmstudio/CC-AeroAutoPilot/releases/latest/download/run.lua run.lua
            run.lua

            # 2. 四軸動力烏龜 FL / FR / BL / BR (下載烏龜韌體):
            wget https://github.com/chiliasmstudio/CC-AeroAutoPilot/releases/latest/download/turtle_startup.lua startup.lua
            reboot
            ```

            ### 📝 構建資訊
            - **Commit SHA**: `${{ github.sha }}`
            - **Branch / Ref**: `${{ github.ref_name }}`
          files: |
            run.lua
            turtle_startup.lua
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
