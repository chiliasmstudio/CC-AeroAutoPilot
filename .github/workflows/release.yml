name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build and Validate run.lua
        run: |
          python bundle.py

      - name: Extract Version from run.lua
        id: vars
        run: |
          LUA_VER=$(python bundle.py --version)
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            TAG_NAME="${LUA_VER}"
          fi
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "lua_version=${LUA_VER}" >> $GITHUB_OUTPUT
          echo "release_title=Release ${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.vars.outputs.tag_name }}
          name: ${{ steps.vars.outputs.release_title }}
          body: |
            ## 🚀 CC-AeroAutoPilot 自動化構建發布 (${{ steps.vars.outputs.tag_name }})

            本 Release 由 GitHub Actions 自動編譯模組並完成語法校驗後產出。

            ### 📦 發布附件 (Assets)
            - **`boot.lua`**：通用 Release 自動下載與開機自啟啟動器 (可下載最新版 run/fcc/display/turtle)。
            - **`fcc.lua`**：分散式獨立飛控大腦 (Flight Control Computer) — 0% 畫面開銷，20Hz 極速 PD-V 飛控。
            - **`display.lua`**：分散式駕駛艙螢幕系統 (Cockpit Display System) — 專職 DirectGPU / Tom's / Normal 儀表渲染。
            - **`run.lua`**：單機一體化飛控大腦程式 (版本：`${{ steps.vars.outputs.lua_version }}`)。
            - **`turtle_startup.lua`**：動力推進烏龜韌體程式 (放置於 FL/FR/BL/BR/FWD 烏龜中)。

            ### ⚡ 萬能自動下載指令 (推薦使用 boot.lua)
            ```bash
            # 1. 執行最新版 (自動從 Release 下載並執行):
            wget run https://raw.githubusercontent.com/chiliasmstudio/CC-AeroAutoPilot/main/boot.lua fcc
            wget run https://raw.githubusercontent.com/chiliasmstudio/CC-AeroAutoPilot/main/boot.lua display
            wget run https://raw.githubusercontent.com/chiliasmstudio/CC-AeroAutoPilot/main/boot.lua run

            # 2. 安裝為本機開機自啟程式 (Install to startup.lua):
            wget run https://raw.githubusercontent.com/chiliasmstudio/CC-AeroAutoPilot/main/boot.lua install fcc
            wget run https://raw.githubusercontent.com/chiliasmstudio/CC-AeroAutoPilot/main/boot.lua install display
            wget run https://raw.githubusercontent.com/chiliasmstudio/CC-AeroAutoPilot/main/boot.lua turtle
            ```

            ### 📝 構建資訊
            - **Commit SHA**: `${{ github.sha }}`
            - **Branch / Ref**: `${{ github.ref_name }}`
          files: |
            run.lua
            fcc.lua
            display.lua
            turtle_startup.lua
            boot.lua
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
